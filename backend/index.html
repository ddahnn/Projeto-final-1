<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicador Inclusivo MVP</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --text: #1e293b;
            --danger: #dc2626;
            --surface: #ffffff;
            --border: #e2e8f0;
            --listen-bg: #e0f2fe;
            --listen-border: #bae6fd;
            --listen-text: #0369a1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .sos-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(220, 38, 38, 0.2);
        }

        /* ----- NOVO: Painel de Escuta (Speech-to-Text) ----- */
        .transcription-panel {
            background-color: var(--listen-bg);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--listen-border);
            margin-bottom: 30px;
        }

        .transcription-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .transcription-header h3 {
            margin: 0;
            color: var(--listen-text);
        }

        .btn-listen {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Animação para indicar que o microfone está ligado */
        .btn-listen.listening {
            background-color: var(--danger);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 10px rgba(220, 38, 38, 0.5); }
            100% { transform: scale(1); }
        }

        .transcription-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            min-height: 60px;
            font-size: 1.1rem;
            color: #334155;
            border: 1px solid var(--border);
        }
        /* --------------------------------------------------- */

        .admin-panel {
            background-color: var(--surface);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .admin-panel h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        input, select {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            min-width: 200px;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-add:hover {
            opacity: 0.9;
        }

        .category-title {
            font-size: 1.2rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .phrase-btn {
            background-color: var(--surface);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px 10px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 60px; 
            font-weight: 500;
        }

        .phrase-btn:active {
            background-color: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Comunicador</h1>
            <button class="sos-btn" onclick="falar('Preciso de ajuda imediata!')">🚨 SOS</button>
        </header>

        <div class="transcription-panel">
            <div class="transcription-header">
                <h3>Modo Ouvir</h3>
                <button id="btn-ouvir" class="btn-listen" onclick="alternarEscuta()">
                    🎤 Iniciar Escuta
                </button>
            </div>
            <div id="texto-transcrito" class="transcription-box">
                O que a outra pessoa falar aparecerá aqui...
            </div>
        </div>

        <div class="admin-panel">
            <h3>Adicionar Nova Categoria</h3>
            <div class="form-group">
                <input type="text" id="input-nova-categoria" placeholder="Ex: Sentimentos">
                <button class="btn-add" onclick="adicionarCategoria()">Criar</button>
            </div>

            <h3>Adicionar Nova Frase</h3>
            <div class="form-group">
                <select id="select-categoria"></select>
                <input type="text" id="input-nova-frase" placeholder="Ex: Estou cansado">
                <button class="btn-add" onclick="adicionarFrase()">Salvar Frase</button>
            </div>
        </div>

        <main id="app-content"></main>
    </div>

    <script>
        // 1. DADOS INICIAIS E LOCALSTORAGE
        const dadosPadrao = [
            { id: "1", nome: "Saudações", frases: ["Olá, tudo bem?", "Bom dia", "Boa tarde"] },
            { id: "2", nome: "Necessidades", frases: ["Pode repetir, por favor?", "Preciso de água"] },
            { id: "3", nome: "Respostas Rápidas", frases: ["Sim", "Não", "Talvez"] }
        ];

        let dadosApp = JSON.parse(localStorage.getItem('comunicadorData')) || dadosPadrao;

        function salvarDados() {
            localStorage.setItem('comunicadorData', JSON.stringify(dadosApp));
            renderizarTela();
        }

        // 2. FUNÇÕES DE ADICIONAR (CRUD)
        function adicionarCategoria() {
            const input = document.getElementById('input-nova-categoria');
            const nomeCategoria = input.value.trim();
            if (nomeCategoria !== "") {
                dadosApp.push({ id: Date.now().toString(), nome: nomeCategoria, frases: [] });
                input.value = ""; 
                salvarDados();
            }
        }

        function adicionarFrase() {
            const select = document.getElementById('select-categoria');
            const input = document.getElementById('input-nova-frase');
            const categoria = dadosApp.find(cat => cat.id === select.value);
            
            if (categoria && input.value.trim() !== "") {
                categoria.frases.push(input.value.trim());
                input.value = ""; 
                salvarDados();
            }
        }

        // 3. RENDERIZAÇÃO
        function renderizarTela() {
            const main = document.getElementById('app-content');
            const selectCategoria = document.getElementById('select-categoria');
            
            main.innerHTML = "";
            selectCategoria.innerHTML = "";

            dadosApp.forEach(categoria => {
                const option = document.createElement('option');
                option.value = categoria.id;
                option.textContent = categoria.nome;
                selectCategoria.appendChild(option);

                if (categoria.frases.length > 0) {
                    const h2 = document.createElement('h2');
                    h2.className = 'category-title';
                    h2.textContent = categoria.nome;
                    main.appendChild(h2);

                    const grid = document.createElement('div');
                    grid.className = 'grid';

                    categoria.frases.forEach(frase => {
                        const button = document.createElement('button');
                        button.className = 'phrase-btn';
                        button.textContent = frase;
                        button.onclick = () => falar(frase);
                        grid.appendChild(button);
                    });
                    main.appendChild(grid);
                }
            });
        }

        // 4. FUNCIONALIDADE DE VOZ E TRANSCRIÇÃO (US02 e US03)
        let reconhecimento = null;
        let escutando = false;

        // Configuração do Speech-to-Text (Ouvir)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            reconhecimento = new SpeechRecognition();
            reconhecimento.lang = 'pt-BR';
            reconhecimento.continuous = true;     // Fica ouvindo continuamente
            reconhecimento.interimResults = true; // Mostra resultados parciais enquanto a pessoa fala

            reconhecimento.onstart = () => {
                escutando = true;
                const btn = document.getElementById('btn-ouvir');
                btn.innerHTML = "🛑 Parar Escuta";
                btn.classList.add('listening');
                document.getElementById('texto-transcrito').textContent = "Ouvindo...";
            };

            reconhecimento.onresult = (event) => {
                let textoFinal = "";
                let textoIntermediario = "";

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        textoFinal += event.results[i][0].transcript;
                    } else {
                        textoIntermediario += event.results[i][0].transcript;
                    }
                }

                const display = document.getElementById('texto-transcrito');
                if (textoFinal !== "") {
                    // Mantém o histórico do que foi falado
                    display.innerHTML += `<strong>${textoFinal} </strong><br>`;
                } else {
                    display.innerHTML += `<span>${textoIntermediario}</span>`;
                }
            };

            reconhecimento.onend = () => {
                // Se o usuário não mandou parar manualmente, reinicia para continuar ouvindo
                if (escutando) {
                    reconhecimento.start();
                } else {
                    finalizarUIEscuta();
                }
            };

            reconhecimento.onerror = (event) => {
                console.error("Erro no reconhecimento: ", event.error);
                escutando = false;
                finalizarUIEscuta();
                if (event.error === 'not-allowed') {
                    alert("Por favor, permita o uso do microfone no seu navegador.");
                }
            };
        } else {
            document.getElementById('btn-ouvir').style.display = 'none';
            document.getElementById('texto-transcrito').textContent = "Seu navegador não suporta transcrição de voz.";
        }

        function alternarEscuta() {
            if (!reconhecimento) return;
            
            if (escutando) {
                escutando = false;
                reconhecimento.stop();
            } else {
                // Limpa a caixa antes de começar a ouvir novamente
                document.getElementById('texto-transcrito').innerHTML = ""; 
                reconhecimento.start();
            }
        }

        function finalizarUIEscuta() {
            const btn = document.getElementById('btn-ouvir');
            btn.innerHTML = "🎤 Iniciar Escuta";
            btn.classList.remove('listening');
        }

        // Modificação no Text-to-Speech (Falar)
        function falar(texto) {
            // Regra Crítica: Se for falar, para de ouvir para não transcrever a voz do robô
            if (escutando && reconhecimento) {
                escutando = false;
                reconhecimento.stop();
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensagem = new SpeechSynthesisUtterance(texto);
                mensagem.lang = 'pt-BR';
                window.speechSynthesis.speak(mensagem);
            }
        }

        // 5. INICIALIZAÇÃO
        renderizarTela();

    </script>
</body>
</html>
